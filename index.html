<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="card">

    <!-- Left Section -->
    <section class="result">

      <h3>Your Result</h3>

      <div class="score-circle">
        <h1>76</h1>
        <p>of 100</p>
      </div>

      <h2>Great</h2>

      <p class="description">
        You scored higher than 65% of the people who have taken these tests.
      </p>

    </section>

    <!-- Right Section -->
    <section class="summary">

      <h3>Summary</h3>

      <div class="category reaction">
        <div class="left">
          <img src="./assets/images/icon-reaction.svg" alt="Reaction icon">
          <span>Reaction</span>
        </div>

        <p><strong>80</strong> / 100</p>
      </div>

      <div class="category memory">
        <div class="left">
          <img src="./assets/images/icon-memory.svg" alt="Memory icon">
          <span>Memory</span>
        </div>

        <p><strong>92</strong> / 100</p>
      </div>

      <div class="category verbal">
        <div class="left">
          <img src="./assets/images/icon-verbal.svg" alt="Verbal icon">
          <span>Verbal</span>
        </div>

        <p><strong>61</strong> / 100</p>
      </div>

      <div class="category visual">
        <div class="left">
          <img src="./assets/images/icon-visual.svg" alt="Visual icon">
          <span>Visual</span>
        </div>

        <p><strong>72</strong> / 100</p>
      </div>

      <button>Continue</button>

    </section>

  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Samarth Varpe</a>.
  </footer>

</body>
</html>
